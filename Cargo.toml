[package]
name = "termcast"
version = "0.1.0"
edition = "2021"
description = "A beautiful weather CLI tool for terminal enthusiasts"
license = "MIT"
authors = ["TermCast Team"]

[lib]
name = "termcast"
path = "src/lib.rs"

[[bin]]
name = "termcast"
path = "src/main.rs"

[dependencies]
crossterm = "0.28"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
urlencoding = "2.1"
dirs = "5.0"
toml = "0.8"
clap_complete = "4.5"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3.14"
dirs = "5.0"

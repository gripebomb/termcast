[package]
name = "termcast"
version = "0.1.0"
edition = "2021"
description = "A beautiful weather CLI tool for terminal enthusiasts"
license = "MIT"
authors = ["TermCast Team"]

[dependencies]
crossterm = "0.28"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
urlencoding = "2.1"

[dev-dependencies]
wiremock = "0.6"
